# Builds and tests SIDM for Android (mobile/android/).
#
# The release APKs are signed with the SIDM release key when the repository has
# the SIDM_KEYSTORE_BASE64 / SIDM_KEYSTORE_PASSWORD secrets; otherwise they are
# left unsigned and signed afterwards (see mobile/android/README.md).
# The debug APKs are always signed with a throwaway debug key, for testing.
name: android

on:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Sign the APKs and add them to site/downloads on this branch"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key (when the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.SIDM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sidm-release.jks"
            echo "SIDM_KEYSTORE=$RUNNER_TEMP/sidm-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (core engine + app strings)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APKs
        env:
          SIDM_KEYSTORE_PASSWORD: ${{ secrets.SIDM_KEYSTORE_PASSWORD }}
          SIDM_KEY_PASSWORD: ${{ secrets.SIDM_KEYSTORE_PASSWORD }}
          SIDM_SITE_URL: ${{ vars.SIDM_SITE_URL }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug

      - name: APK sizes
        run: find app/build/outputs/apk -name '*.apk' -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: sidm-android-apks
          path: mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          compression-level: 0

  # Run by hand (Actions > android > Run workflow, "publish" ticked) for a release:
  # builds the APKs signed with the SIDM release key, then scripts/release.py
  # copies them to site/downloads and writes their size and SHA-256 on the site,
  # and the result is committed to the branch it ran on.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIDM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the SIDM_KEYSTORE_BASE64 and SIDM_KEYSTORE_PASSWORD repository secrets first (mobile/android/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sidm-release.jks"
          echo "SIDM_KEYSTORE=$RUNNER_TEMP/sidm-release.jks" >> "$GITHUB_ENV"

      - name: Signed release APKs
        working-directory: mobile/android
        env:
          SIDM_KEYSTORE_PASSWORD: ${{ secrets.SIDM_KEYSTORE_PASSWORD }}
          SIDM_KEY_PASSWORD: ${{ secrets.SIDM_KEYSTORE_PASSWORD }}
          SIDM_SITE_URL: ${{ vars.SIDM_SITE_URL }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Add them to the website
        run: python scripts/release.py --android-only --apk-dir mobile/android/app/build/outputs/apk/release

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/downloads/*.apk
          git add -A site/downloads site/index.html site/version.json
          git commit -m "chore: signed Android APKs for the website"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # On an Android emulator: the app starts, the video engine unpacks and runs,
  # a real file lands in Downloads/SIDM, DRM is refused, and a report of what
  # yt-dlp finds on real social sites (report only; sites may block CI machines).
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile/android
          script: |
            adb logcat -c
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || (adb logcat -d -s SIDM-SITES:I SIDM-TEST:I SIDM.engine:* SIDM.video:* AndroidRuntime:E > device-log.txt; exit 1)
            adb logcat -d -s SIDM-SITES:I SIDM-TEST:I SIDM.engine:* SIDM.video:* AndroidRuntime:E > device-log.txt

      - name: Real sites report
        if: always()
        working-directory: mobile/android
        run: |
          echo "## What yt-dlp found on real sites (emulator)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -h "SIDM-SITES" device-log.txt | sed 's/^.*SIDM-SITES[^:]*: //' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat device-log.txt || true
          echo "--- failed tests ---"
          find app/build/outputs/androidTest-results -name '*.xml' -exec grep -h -A25 '<failure' {} + 2>/dev/null | head -150 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidm-android-device-test
          path: |
            mobile/android/device-log.txt
            mobile/android/app/build/reports/androidTests/
          retention-days: 14
