<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GetSmart DM</title>
    <link rel="stylesheet" href="ui.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="" />
        <div>
          <div class="brand-name" data-i18n="appName"></div>
          <div class="brand-tagline" data-i18n="tagline"></div>
        </div>
      </div>
      <button id="open-settings" class="icon-button" type="button" data-i18n-title="openSettings">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
          <circle cx="16" cy="7" r="2" />
          <circle cx="10" cy="17" r="2" />
        </svg>
      </button>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" id="tab-downloads" aria-controls="panel-downloads" aria-selected="true" data-i18n="tabDownloads"></button>
      <button class="tab" role="tab" type="button" id="tab-page" aria-controls="panel-page" aria-selected="false" data-i18n="tabThisPage"></button>
    </nav>

    <main>
      <section class="panel" id="panel-downloads" role="tabpanel" aria-labelledby="tab-downloads">
        <div class="empty">
          <div class="empty-art">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4v11M7 10l5 5 5-5M5 20h14" />
            </svg>
          </div>
          <p class="empty-title" data-i18n="emptyDownloadsTitle"></p>
          <p class="empty-body" data-i18n="emptyDownloadsBody"></p>
        </div>
      </section>

      <section class="panel" id="panel-page" role="tabpanel" aria-labelledby="tab-page" hidden>
        <div class="empty">
          <div class="empty-art">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3" />
              <path d="M10 9.5v5l4.5-2.5z" />
            </svg>
          </div>
          <p class="empty-title" data-i18n="emptyPageTitle"></p>
          <p class="empty-body" data-i18n="emptyPageBody"></p>
        </div>
      </section>
    </main>

    <footer class="popup-footer">
      <a id="update-link" class="update-link" href="#" hidden data-i18n="updateAvailable"></a>
    </footer>
  </body>
</html>
