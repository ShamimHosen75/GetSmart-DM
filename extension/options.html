<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GetSmart DM</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="ui.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body class="options">
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="" />
        <div>
          <div class="brand-name" data-i18n="appName"></div>
          <div class="brand-tagline" data-i18n="tagline"></div>
        </div>
      </div>
    </header>

    <main class="options-main">
      <h1 class="page-title" data-i18n="settingsTitle"></h1>

      <section class="card">
        <h2 class="card-title" data-i18n="sectionAppearance"></h2>
        <div class="row">
          <div>
            <div class="row-label"><label for="language" data-i18n="language"></label></div>
            <div class="row-hint" data-i18n="languageHint"></div>
          </div>
          <select id="language" class="select" data-setting="language">
            <option value="auto" data-i18n="langAuto"></option>
            <option value="en" data-i18n="langEn"></option>
            <option value="bn" data-i18n="langBn"></option>
          </select>
        </div>
        <div class="row">
          <div>
            <div class="row-label"><label for="theme" data-i18n="theme"></label></div>
            <div class="row-hint" data-i18n="themeHint"></div>
          </div>
          <select id="theme" class="select" data-setting="theme">
            <option value="auto" data-i18n="themeAuto"></option>
            <option value="light" data-i18n="themeLight"></option>
            <option value="dark" data-i18n="themeDark"></option>
          </select>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title" data-i18n="sectionDownloads"></h2>
        <label class="row">
          <div>
            <div class="row-label" data-i18n="setSortFolders"></div>
            <div class="row-hint" data-i18n="setSortFoldersHint"></div>
          </div>
          <input type="checkbox" class="switch" id="sortIntoFolders" data-setting="sortIntoFolders" data-kind="bool" />
        </label>
        <div class="row">
          <div>
            <div class="row-label"><label for="maxSimultaneous" data-i18n="setMaxSimultaneous"></label></div>
            <div class="row-hint" data-i18n="setMaxSimultaneousHint"></div>
          </div>
          <input type="number" class="number" id="maxSimultaneous" min="1" max="10" step="1" data-setting="maxSimultaneous" data-kind="int" data-min="1" data-max="10" />
        </div>
        <label class="row">
          <div>
            <div class="row-label" data-i18n="setUseCompanion"></div>
            <div class="row-hint" data-i18n="setUseCompanionHint"></div>
          </div>
          <input type="checkbox" class="switch" id="useCompanion" data-setting="useCompanion" data-kind="bool" />
        </label>
        <div class="row">
          <div>
            <div class="row-label"><label for="connections" data-i18n="setConnections"></label></div>
            <div class="row-hint" data-i18n="setConnectionsHint"></div>
          </div>
          <input type="number" class="number" id="connections" min="1" max="16" step="1" data-setting="connections" data-kind="int" data-min="1" data-max="16" />
        </div>
        <div class="row">
          <div>
            <div class="row-label"><label for="speedLimitKBps" data-i18n="setSpeedLimit"></label></div>
            <div class="row-hint" data-i18n="setSpeedLimitHint"></div>
          </div>
          <input type="number" class="number" id="speedLimitKBps" min="0" max="1048576" step="50" data-setting="speedLimitKBps" data-kind="int" data-min="0" data-max="1048576" />
        </div>
        <label class="row">
          <div>
            <div class="row-label" data-i18n="setAskWhere"></div>
            <div class="row-hint" data-i18n="setAskWhereHint"></div>
          </div>
          <input type="checkbox" class="switch" id="askWhereToSave" data-setting="askWhereToSave" data-kind="bool" />
        </label>
        <div class="row">
          <div>
            <div class="row-label"><label for="progressWindow" data-i18n="setProgressWindow"></label></div>
            <div class="row-hint" data-i18n="setProgressWindowHint"></div>
          </div>
          <select id="progressWindow" class="select" data-setting="progressWindow">
            <option value="off" data-i18n="progWinOff"></option>
            <option value="ours" data-i18n="progWinOurs"></option>
            <option value="all" data-i18n="progWinAll"></option>
          </select>
        </div>
        <label class="row">
          <div>
            <div class="row-label" data-i18n="setNotifications"></div>
            <div class="row-hint" data-i18n="setNotificationsHint"></div>
          </div>
          <input type="checkbox" class="switch" id="notifications" data-setting="notifications" data-kind="bool" />
        </label>
      </section>

      <section class="card">
        <h2 class="card-title" data-i18n="sectionMedia"></h2>
        <label class="row">
          <div>
            <div class="row-label" data-i18n="setMediaDetection"></div>
            <div class="row-hint" data-i18n="setMediaDetectionHint"></div>
          </div>
          <input type="checkbox" class="switch" id="mediaDetection" data-setting="mediaDetection" data-kind="bool" />
        </label>
        <label class="row">
          <div>
            <div class="row-label" data-i18n="setVideoButton"></div>
            <div class="row-hint" data-i18n="setVideoButtonHint"></div>
          </div>
          <input type="checkbox" class="switch" id="showVideoButton" data-setting="showVideoButton" data-kind="bool" />
        </label>
        <div class="row">
          <div>
            <div class="row-label"><label for="minMediaSizeKB" data-i18n="setMinSize"></label></div>
            <div class="row-hint" data-i18n="setMinSizeHint"></div>
          </div>
          <input type="number" class="number" id="minMediaSizeKB" min="0" max="1048576" step="50" data-setting="minMediaSizeKB" data-kind="int" data-min="0" data-max="1048576" />
        </div>
        <div class="row row-stack">
          <div>
            <div class="row-label"><label for="disabledSites" data-i18n="setDisabledSites"></label></div>
            <div class="row-hint" data-i18n="setDisabledSitesHint"></div>
          </div>
          <textarea id="disabledSites" class="textarea" rows="4" spellcheck="false" placeholder="example.com" data-setting="disabledSites" data-kind="sites"></textarea>
        </div>
      </section>

      <section class="card" id="companion">
        <h2 class="card-title" data-i18n="sectionVideo"></h2>
        <div class="row">
          <div>
            <div class="row-label" data-i18n="setCompanion"></div>
            <div class="row-hint" id="companion-detail"></div>
          </div>
          <div class="v-status" id="companion-status"><span class="v-dot"></span><span id="companion-text"></span></div>
        </div>
        <div class="row">
          <div>
            <div class="row-label"><label for="defaultQuality" data-i18n="setDefaultQuality"></label></div>
            <div class="row-hint" data-i18n="setDefaultQualityHint"></div>
          </div>
          <select id="defaultQuality" class="select" data-setting="defaultQuality">
            <option value="best" data-i18n="qualityBest"></option>
            <option value="1080" data-i18n="quality1080"></option>
            <option value="720" data-i18n="quality720"></option>
            <option value="480" data-i18n="quality480"></option>
            <option value="360" data-i18n="quality360"></option>
            <option value="audio" data-i18n="qualityAudio"></option>
          </select>
        </div>
        <label class="row">
          <div>
            <div class="row-label" data-i18n="setAllowYouTube"></div>
            <div class="row-hint" data-i18n="setAllowYouTubeHint"></div>
          </div>
          <input type="checkbox" class="switch" id="allowYouTube" data-kind="youtube" />
        </label>
      </section>

      <section class="card" id="scheduler">
        <h2 class="card-title" data-i18n="sectionScheduler"></h2>
        <label class="row">
          <div>
            <div class="row-label" data-i18n="setSchedule"></div>
            <div class="row-hint" data-i18n="setScheduleHint"></div>
          </div>
          <input type="checkbox" class="switch" id="scheduleEnabled" data-setting="scheduleEnabled" data-kind="bool" />
        </label>
        <div class="row">
          <div class="row-label"><label for="scheduleStart" data-i18n="setScheduleStart"></label></div>
          <input type="time" class="number time" id="scheduleStart" data-setting="scheduleStart" />
        </div>
        <div class="row">
          <div>
            <div class="row-label"><label for="scheduleStop" data-i18n="setScheduleStop"></label></div>
            <div class="row-hint" data-i18n="setScheduleStopHint"></div>
          </div>
          <input type="time" class="number time" id="scheduleStop" data-setting="scheduleStop" />
        </div>
        <div class="row row-stack">
          <div class="row-label" data-i18n="setScheduleDays"></div>
          <div class="days" id="scheduleDays" data-setting="scheduleDays" data-kind="days"><label class="day"><input type="checkbox" value="1" /><span data-i18n="day1"></span></label><label class="day"><input type="checkbox" value="2" /><span data-i18n="day2"></span></label><label class="day"><input type="checkbox" value="3" /><span data-i18n="day3"></span></label><label class="day"><input type="checkbox" value="4" /><span data-i18n="day4"></span></label><label class="day"><input type="checkbox" value="5" /><span data-i18n="day5"></span></label><label class="day"><input type="checkbox" value="6" /><span data-i18n="day6"></span></label><label class="day"><input type="checkbox" value="0" /><span data-i18n="day0"></span></label></div>
        </div>
        <div class="row">
          <div>
            <div class="row-label"><label for="whenQueueDone" data-i18n="setWhenDone"></label></div>
            <div class="row-hint" data-i18n="setWhenDoneHint"></div>
          </div>
          <select id="whenQueueDone" class="select" data-setting="whenQueueDone">
            <option value="nothing" data-i18n="whenDoneNothing"></option>
            <option value="notify" data-i18n="whenDoneNotify"></option>
            <option value="close" data-i18n="whenDoneClose"></option>
          </select>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title" data-i18n="sectionAbout"></h2>
        <div class="row">
          <div class="row-label" data-i18n="version"></div>
          <div class="row-value" id="version"></div>
        </div>
        <div class="row">
          <div class="row-label" data-i18n="extensionId"></div>
          <div class="row-value" id="extension-id"></div>
        </div>
      </section>

    </main>

    <dialog class="dialog" id="yt-dialog">
      <form method="dialog">
        <h2 class="dialog-title" data-i18n="ytDialogTitle"></h2>
        <p data-i18n="ytDialogBody1"></p>
        <p data-i18n="ytDialogBody2"></p>
        <div class="add-buttons">
          <button value="cancel" class="text-button" data-i18n="cancelButton"></button>
          <button value="accept" class="primary-button" id="yt-accept" data-i18n="ytDialogAccept"></button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" data-i18n="saved"></div>
  </body>
</html>
